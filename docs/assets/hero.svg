      </g>
      <g transform="translate(194 322)">
        <rect width="104" height="34" rx="17" fill="#14532d" stroke="#22c55e"/>
        <text x="52" y="22" fill="#bbf7d0" text-anchor="middle">&#10003; Specify</text>
      </g>
      <g transform="translate(310 322)">
        <rect width="88" height="34" rx="17" fill="#14532d" stroke="#22c55e"/>
        <text x="44" y="22" fill="#bbf7d0" text-anchor="middle">&#10003; Plan</text>
      </g>
      <g transform="translate(410 322)">
        <rect width="90" height="34" rx="17" fill="#1e293b" stroke="#64748b"/>
        <text x="45" y="22" fill="#e2e8f0" text-anchor="middle">&#9675; Tasks</text>
      </g>
      <g transform="translate(512 322)">
        <rect width="124" height="34" rx="17" fill="#1e293b" stroke="#64748b"/>
