      <text x="292" y="44" fill="#16a34a" font-size="17" font-weight="700" text-anchor="end">92%</text>
      <rect x="24" y="58" width="268" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="24" y="58" width="246" height="8" rx="4" fill="#22c55e"/>
      <g font-size="14" fill="#334155">
        <text x="24" y="100">REQ-001 &#8594; UC-001 &#8594; ADR-001 &#8594; TEST-001</text>
        <text x="24" y="132">&#10003; 14 modules, English and French</text>
        <text x="24" y="160">&#10003; AI proposes, people approve</text>
