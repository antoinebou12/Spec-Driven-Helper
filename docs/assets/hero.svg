    <path d="M86 68l12 6-12 6-12-6zM74 82l12 6 12-6M74 88l12 6 12-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="122" y="87" fill="#fff" font-size="24" font-weight="700">SDD Studio</text>
    <text x="64" y="146" fill="#93c5fd" font-size="16" font-weight="700" letter-spacing="2">SPEC-DRIVEN DEVELOPMENT, SELF-HOSTED</text>
    <text x="64" y="198" fill="#fff" font-size="48" font-weight="800" letter-spacing="-1.5">Great software starts</text>
    <text x="64" y="252" fill="#fff" font-size="48" font-weight="800" letter-spacing="-1.5">with a clear plan.</text>
    <text x="64" y="292" fill="#cbd5e1" font-size="19">Requirements, architecture and decisions in one reviewed, traceable specification.</text>
    <g font-size="15" font-weight="600">
      <g transform="translate(64 322)">
        <rect width="118" height="34" rx="17" fill="#14532d" stroke="#22c55e"/>
