# Separate images: the API and worker (docker/api.Dockerfile) and the web client served by
# unprivileged nginx (docker/web.Dockerfile), which proxies /api. Open http://localhost:8080.
#   docker compose -f compose.yaml -f compose.split.yaml up -d --build
services:
  app:
    # Replaced by api + web; only started when this profile is asked for explicitly.
    profiles: ['all-in-one']

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: sdd-studio-api:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://sdd:${POSTGRES_PASSWORD:-sdd-local-development}@postgres:5432/sdd_studio
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://host.docker.internal:11434}
      HOST: 0.0.0.0
      HOME: /tmp
      APP_ORIGIN: ${COMPOSE_APP_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: 'true'
    extra_hosts: ['host.docker.internal:host-gateway']
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /app/.runtime:size=64m,uid=1000,gid=1000
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]

  worker:
    image: sdd-studio-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ['/app/node_modules/.bin/tsx', 'apps/api/src/worker.ts']

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: sdd-studio-web:local
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3001
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=64m
    depends_on:
      api:
        condition: service_healthy
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
