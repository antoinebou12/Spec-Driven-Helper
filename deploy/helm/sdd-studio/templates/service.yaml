apiVersion: v1
kind: Service
metadata:
  name: {{ include "sdd.fullname" . }}
  labels:
    {{- include "sdd.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sdd.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
