{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.encryptionKey }}{{ fail "Set secrets.encryptionKey (64 hexadecimal characters) or secrets.existingSecret" }}{{ end }}
{{- if not (regexMatch "^[0-9a-fA-F]{64}$" .Values.secrets.encryptionKey) }}{{ fail "secrets.encryptionKey must be 64 hexadecimal characters" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sdd.fullname" . }}
  labels: {{- include "sdd.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  BOOTSTRAP_EMAIL: {{ .Values.secrets.bootstrapEmail | quote }}
  BOOTSTRAP_PASSWORD: {{ .Values.secrets.bootstrapPassword | quote }}
  METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
  {{- if not .Values.database.existingSecret }}
  {{- if not .Values.database.url }}{{ fail "Set database.url or database.existingSecret" }}{{ end }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
{{- end }}
