# Prometheus for SDD Studio (compose.observability.yaml). The metrics token is a Compose secret.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sdd-studio
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['app:3001']
        labels: { service: api }

  - job_name: netdata
    metrics_path: /api/v1/allmetrics
    params: { format: [prometheus] }
    honor_labels: true
    static_configs:
      - targets: ['netdata:19999']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
